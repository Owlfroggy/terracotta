name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.4.1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version and Tag
        run: |
          deno run -A scripts/release.ts --version ${{ github.event.inputs.version }} --yes
